# Portainer: Stacks -> Add stack -> Web editor, paste this.
# Set BLABLALINK_COOKIE in the stack's Environment variables (never in this file).
# The image is built by GitHub Actions from main and published to ghcr.io.
services:
  blablalink-mcp:
    image: ghcr.io/electroknight222/blablalink-mcp:latest
    container_name: blablalink-mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Taipei
      BLABLALINK_COOKIE: ${BLABLALINK_COOKIE:-}
      # hostnames/IPs allowed to call the server, e.g. nikke.engramm.net,10.22.10.2:*
      BLABLALINK_ALLOWED_HOSTS: ${BLABLALINK_ALLOWED_HOSTS:-10.22.10.2:*,localhost:*,127.0.0.1:*}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
