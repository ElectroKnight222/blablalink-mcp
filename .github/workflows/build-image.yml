# Builds the container image on GitHub (from the push mirror of git.engramm.net)
# and publishes it to ghcr.io/electroknight222/blablalink-mcp.
# Only runs for main on the GitHub mirror; mirrored PR branches are never built.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'ElectroKnight222/blablalink-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/electroknight222/blablalink-mcp:latest
            ghcr.io/electroknight222/blablalink-mcp:sha-${{ github.sha }}
