[project]
name = "blablalink-mcp"
version = "0.1.0"
description = "Unofficial MCP server for NIKKE account data on blablalink.com"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10,<2", "httpx>=0.27"]

[project.scripts]
blablalink-mcp = "blablalink_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
